<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F2F0EB" />
    <!-- Apply the saved theme before anything paints, so the page background and
         the browser's status-bar tint are right from the first frame (the app
         re-applies it on start; see src/themes.js). -->
    <script>
      (function () {
        try {
          var id = localStorage.getItem('scribble-theme') || 'dark-dots'
          if (['dark-dots', 'light-dots', 'paintbrush'].indexOf(id) < 0) id = 'dark-dots'
          document.documentElement.dataset.theme = id
          var c = id === 'light-dots' ? '#F0F0F0' : id === 'dark-dots' ? '#212121' : '#F2F0EB'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', c)
        } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-title" content="Easels" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=3" />
    <title>Easels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,700&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
